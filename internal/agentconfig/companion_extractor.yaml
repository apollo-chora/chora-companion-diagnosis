# companion_extractor — per-sub-agent model + prompt config (ADR-205 WS-2).
#
# AGENT-DRIVEN tiering: this YAML is the single source of truth for the
# extractor's model. The agent sends primary_model as the gateway's
# logical_model_id and fallback_models as the agent-declared fallback chain
# (InvokeRequest.fallback_logical_model_ids); the gateway HONOURS it.
#
# The extractor faithfully TRANSCRIBES / DESCRIBES an uploaded learning artifact
# (a marked test, free-form notes, a hand-drawn scribble, or source material)
# into plain text for the diagnoser. That demands a strong MULTIMODAL reader:
# longcat-2.5-preview (LongCat-2.5-Preview via chora-model-gateway) is the
# platform's single text route and declares vision, so it is both the primary
# and the only fallback — the old HIGH/CHEAP tiering collapses to this one model.
# prompt_version selects the instruction template (WS-3 will resolve it against
# the ADR-197 prompt registry; today it labels the embedded default in
# internal/agent/instructions.go).
agent: companion_extractor
sub_agents:
  extractor:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
